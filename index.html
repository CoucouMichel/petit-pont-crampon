<script>
        let allPlayersData = {};
        let clubCountriesData = {};
        let clubNameMappingData = {};
        let countryMappingData = {};
        let countriesData = {};
        let clubLogosData = {};

        let selectedPlayer = null;
        let attempts = 0;
        let score = 60;
        let tableSize = 0;
        let revealLettersOnce = false;
        let usedPlayers = JSON.parse(localStorage.getItem("usedPlayers") || "[]");

        // Éléments DOM
        const playerNameDisplay = document.getElementById("player-name-display");
        const playerNameDisplayBox = document.getElementById("player-name-display-box");
        const playerNameBox = document.getElementById("player-name-box");
        const playerNationalityDiv = document.getElementById("player-nationality");
        const guessInput = document.getElementById("guess-input");
        const autocompleteList = document.getElementById("autocomplete-list");
        const scoreElement = document.getElementById("score");
        const attemptsElement = document.getElementById("attempts");
        const infoWindow = document.getElementById("info-window");

        const indiceClubButton = document.getElementById("indiceClubButton");
        const indiceCountryButton = document.getElementById("indiceCountryButton");
        const indiceNationalityButton = document.getElementById("indiceNationalityButton");
        const revealLettersButton = document.getElementById("revealLettersButton");
        const reponseButton = document.getElementById("reponseButton");
        const nouveauJoueurButton = document.getElementById("nouveauJoueurButton");

        async function loadJSON(path) {
            try {
                const res = await fetch(path);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (err) {
                console.warn(`[Info] Fichier non chargé : ${path}`, err);
                return null;
            }
        }

        async function initGame() {
            // Avertissement protocole file:///
            if (window.location.protocol === 'file:') {
                console.error("ATTENTION : Vous ouvrez la page en 'file://'. Les navigateurs bloquent fetch(). Utilisez un serveur local (Live Server, python -m http.server, etc.)");
            }

            // Chargement de l'ensemble des JSON
            allPlayersData = await loadJSON('./players_stats.json');
            clubCountriesData = await loadJSON('./clubscountries.json') || {};
            clubNameMappingData = await loadJSON('./clubNameMapping.json') || {};
            countryMappingData = await loadJSON('./country2letters.json') || {};
            countriesData = await loadJSON('./countries.json') || {};
            clubLogosData = await loadJSON('./clubLogos.json') || {};

            // Fallback de secours si players_stats.json n'est pas accessible
            if (!allPlayersData || Object.keys(allPlayersData).length === 0) {
                const tableBody = document.getElementById('career-table-body');
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="3" style="text-align: center; color: #ef4444; padding: 20px;">
                            ⚠️ Impossible de charger <code>players_stats.json</code>.<br><br>
                            <small style="color: #94a3b8;">
                                Si vous testez en local, lancez un serveur local (ex: <b>Live Server</b> sous VS Code ou <code>python -m http.server</code>).
                            </small>
                        </td>
                    </tr>
                `;
                return;
            }

            // Sélection du joueur
            const players = Object.keys(allPlayersData).filter(p => !usedPlayers.includes(p));
            if (players.length === 0) {
                usedPlayers = [];
                localStorage.setItem('usedPlayers', JSON.stringify(usedPlayers));
                selectedPlayer = Object.keys(allPlayersData)[Math.floor(Math.random() * Object.keys(allPlayersData).length)];
            } else {
                selectedPlayer = players[Math.floor(Math.random() * players.length)];
            }

            usedPlayers.push(selectedPlayer);
            localStorage.setItem('usedPlayers', JSON.stringify(usedPlayers));

            const rawStats = allPlayersData[selectedPlayer];
            console.log("Joueur sélectionné :", selectedPlayer);

            // Affichage des boîtes de lettres
            playerNameDisplay.innerHTML = "";
            for (let i = 0; i < selectedPlayer.length; i++) {
                if (selectedPlayer[i] === " ") {
                    const space = document.createElement("span");
                    space.innerHTML = "&nbsp;&nbsp;";
                    playerNameDisplay.appendChild(space);
                } else {
                    const rect = document.createElement("span");
                    rect.classList.add("player-name-rectangle", "hidden-letter");
                    rect.id = `letter-${i}`;
                    playerNameDisplay.appendChild(rect);
                }
            }

            // Nationalité
            if (clubCountriesData[selectedPlayer]) {
                const countryName = clubCountriesData[selectedPlayer];
                const countryCode = countriesData[countryName] || countryName;
                const flagUrl = `https://flagcdn.com/w20/${String(countryCode).toLowerCase()}.png`;
                playerNationalityDiv.innerHTML = `
                    <img src="${flagUrl}" alt="${countryName}" style="width: 20px; height: 14px; border-radius: 2px;">
                    <span>${countryName}</span>
                `;
            }

            // Traitement des saisons/lignes de carrière
            const tableBody = document.getElementById('career-table-body');
            tableBody.innerHTML = '';
            let mergedStats = [];
            let currentMerged = null;

            if (Array.isArray(rawStats)) {
                for (const stat of rawStats) {
                    if (stat.season && String(stat.season).toLowerCase().includes("season")) continue;
                    const formattedClub = clubNameMappingData[stat.team] || stat.team;
                    const fullCountry = countryMappingData[stat.country] || stat.country;

                    if (currentMerged && currentMerged.team === formattedClub && currentMerged.country === fullCountry) {
                        currentMerged.endSeason = stat.season;
                    } else {
                        if (currentMerged) mergedStats.push(currentMerged);
                        currentMerged = {
                            startSeason: stat.season,
                            endSeason: stat.season,
                            team: formattedClub,
                            country: fullCountry,
                            teamCode: stat.team,
                            countryCode: stat.country
                        };
                    }
                }
                if (currentMerged) mergedStats.push(currentMerged);
            }

            tableSize = mergedStats.length;

            // Remplissage du tableau
            mergedStats.forEach(stat => {
                const fullCountry = countryMappingData[stat.countryCode] || stat.countryCode || stat.country;
                const flagCode = stat.countryCode || '';
                const flagUrl = `https://flagcdn.com/w20/${String(flagCode).toLowerCase()}.png`;
                const formattedClub = clubNameMappingData[stat.teamCode] || stat.teamCode || stat.team;
                const logoUrl = clubLogosData[stat.teamCode] || '';
                
                const startSeason = String(stat.startSeason || '');
                const endSeason = String(stat.endSeason || '');
                const formattedSeason = (startSeason === endSeason || !endSeason) ? 
                    startSeason.substring(0, 9) : 
                    `${startSeason.substring(0, 4)}-${endSeason.substring(endSeason.length - 4)}`;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${formattedSeason}</td>
                    <td class="cell-hidden" data-club="${stat.teamCode || formattedClub}">
                        <span class="cell-content">
                            ${logoUrl ? `<img src="${logoUrl}" style="width: 18px; height: 18px; margin-right: 8px; vertical-align: middle;">` : ''}
                            ${formattedClub}
                        </span>
                    </td>
                    <td class="cell-hidden" data-country="${fullCountry}">
                        <span class="cell-content">
                            ${flagCode ? `<img src="${flagUrl}" style="width: 18px; height: 13px; margin-right: 8px; vertical-align: middle; border-radius: 2px;">` : ''}
                            ${fullCountry}
                        </span>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            updateScoreDisplay();
        }

        // Suggestions d'autocomplétion
        function showSuggestions(val) {
            autocompleteList.innerHTML = "";
            if (!val || val.trim() === "") return;

            const normalizedVal = val.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
            const suggestions = new Set();

            // 1. Joueurs
            Object.keys(allPlayersData).forEach(player => {
                const normalizedPlayer = player.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
                if (normalizedPlayer.includes(normalizedVal)) {
                    suggestions.add(player);
                }
            });

            // 2. Clubs & Pays
            for (let club in clubCountriesData) {
                const country = clubCountriesData[club];
                const normalizedClub = club.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
                const normalizedCountry = String(country).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

                if (normalizedClub.includes(normalizedVal)) suggestions.add(club);
                if (normalizedCountry.includes(normalizedVal)) suggestions.add(country);
            }

            const sorted = Array.from(suggestions).slice(0, 8);
            sorted.forEach((item, index) => {
                const li = document.createElement("li");
                li.textContent = item;
                li.classList.add("suggestion-item");
                if (index === 0) li.classList.add("selected");
                
                li.addEventListener("click", () => {
                    guessInput.value = "";
                    autocompleteList.innerHTML = "";
                    checkAnswer(item);
                });
                autocompleteList.appendChild(li);
            });
        }

        function checkAnswer(inputVal) {
            const answer = inputVal.trim().toLowerCase();
            
            const reverseMapping = Object.fromEntries(
                Object.entries(countryMappingData).map(([abbr, full]) => [full.toLowerCase(), abbr.toLowerCase()])
            );
            const originalClubMapping = Object.fromEntries(
                Object.entries(clubNameMappingData).map(([orig, fmt]) => [fmt.toLowerCase(), orig.toLowerCase()])
            );

            let checkVal = originalClubMapping[answer] || answer;
            let isCorrect = false;

            // Victoire joueur mystère
            if (checkVal === selectedPlayer.toLowerCase() || answer === selectedPlayer.toLowerCase()) {
                playerNameDisplayBox.textContent = selectedPlayer;
                playerNameBox.classList.add("visible");
                playerNameDisplay.style.display = "none";
                playerNationalityDiv.classList.add("hidden-panel");
                revealAllCells();

                let bonus = 40;
                score = Math.max(0, score - (attempts * 0.5)) + bonus;
                updateScoreDisplay();
                guessInput.disabled = true;
                disableAllButtons();
                blinkInput(true);
                return;
            } else {
                attempts++;
                attemptsElement.textContent = `Essais : ${attempts}`;
            }

            // Révélation de cellules
            const cells = document.querySelectorAll('td[data-country], td[data-club]');
            cells.forEach(cell => {
                const cellCountry = (cell.getAttribute('data-country') || '').toLowerCase();
                const cellClub = (cell.getAttribute('data-club') || '').toLowerCase();

                if (cellClub === checkVal || cellClub === answer) {
                    revealCell(cell);
                    const countrySibling = cell.parentElement.querySelector('td[data-country]');
                    if (countrySibling) revealCell(countrySibling);
                    isCorrect = true;
                } else if (cellCountry === answer || reverseMapping[cellCountry] === answer) {
                    revealCell(cell);
                    isCorrect = true;
                }
            });

            blinkInput(isCorrect);
        }

        function revealCell(cell) {
            cell.classList.remove('cell-hidden');
            cell.classList.add('cell-visible');
        }

        function revealAllCells() {
            document.querySelectorAll('#career-table-body td').forEach(td => revealCell(td));
        }

        function blinkInput(isCorrect) {
            guessInput.classList.add(isCorrect ? "blink-green" : "blink-red");
            setTimeout(() => {
                guessInput.classList.remove("blink-green", "blink-red");
            }, 600);
        }

        function updateScoreDisplay() {
            scoreElement.innerHTML = `Score : ${score.toFixed(2)} <span id="info-icon" style="cursor: pointer; margin-left: 6px;">&#9432;</span>`;
            reattachInfoIcon();
        }

        function disableAllButtons() {
            [indiceClubButton, indiceCountryButton, indiceNationalityButton, revealLettersButton, reponseButton].forEach(btn => {
                btn.disabled = true;
                btn.classList.add("button-disabled");
            });
        }

        function reattachInfoIcon() {
            const icon = document.getElementById("info-icon");
            if (icon) {
                icon.onclick = () => infoWindow.classList.toggle("hidden-panel");
            }
        }

        // Événements
        guessInput.addEventListener("input", (e) => showSuggestions(e.target.value));
        guessInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const selected = autocompleteList.querySelector('.suggestion-item.selected') || autocompleteList.querySelector('.suggestion-item');
                const val = selected ? selected.textContent : guessInput.value;
                if (val) {
                    checkAnswer(val);
                    guessInput.value = "";
                    autocompleteList.innerHTML = "";
                }
                e.preventDefault();
            }
        });

        indiceClubButton.addEventListener("click", () => {
            if (!selectedPlayer) return;
            const hiddenClubs = Array.from(document.querySelectorAll('td[data-club].cell-hidden'));
            if (hiddenClubs.length > 0) {
                attempts++;
                attemptsElement.textContent = `Essais : ${attempts}`;
                const target = hiddenClubs[Math.floor(Math.random() * hiddenClubs.length)];
                revealCell(target);
                const countrySibling = target.parentElement.querySelector('td[data-country]');
                if (countrySibling) revealCell(countrySibling);
                score -= Math.round(20 / (tableSize || 1));
                updateScoreDisplay();
            }
            if (document.querySelectorAll('td[data-club].cell-hidden').length === 0) {
                indiceClubButton.disabled = true;
            }
        });

        indiceCountryButton.addEventListener("click", () => {
            if (!selectedPlayer) return;
            const hiddenCountries = Array.from(document.querySelectorAll('td[data-country].cell-hidden'));
            if (hiddenCountries.length > 0) {
                attempts++;
                attemptsElement.textContent = `Essais : ${attempts}`;
                const target = hiddenCountries[Math.floor(Math.random() * hiddenCountries.length)];
                revealCell(target);
                score -= Math.round(10 / (tableSize || 1));
                updateScoreDisplay();
            }
            if (document.querySelectorAll('td[data-country].cell-hidden').length === 0) {
                indiceCountryButton.disabled = true;
            }
        });

        indiceNationalityButton.addEventListener("click", () => {
            if (!selectedPlayer) return;
            playerNationalityDiv.classList.remove("hidden-panel");
            indiceNationalityButton.disabled = true;
            score -= 10;
            attempts++;
            attemptsElement.textContent = `Essais : ${attempts}`;
            updateScoreDisplay();
        });

        revealLettersButton.addEventListener("click", () => {
            if (!selectedPlayer || revealLettersOnce) return;
            document.querySelectorAll('.player-name-rectangle').forEach(rect => {
                rect.classList.remove('hidden-letter');
            });
            revealLettersOnce = true;
            revealLettersButton.disabled = true;
            score -= 20;
            attempts++;
            attemptsElement.textContent = `Essais : ${attempts}`;
            updateScoreDisplay();
        });

        reponseButton.addEventListener("click", () => {
            if (!selectedPlayer) return;
            playerNameDisplayBox.textContent = selectedPlayer;
            playerNameBox.classList.add("visible");
            playerNameDisplay.style.display = "none";
            revealAllCells();
            score = 0;
            updateScoreDisplay();
            disableAllButtons();
            guessInput.disabled = true;
        });

        nouveauJoueurButton.addEventListener("click", () => location.reload());
        document.getElementById("close-info").addEventListener("click", () => infoWindow.classList.add("hidden-panel"));

        // Lancement
        initGame();
    </script>
